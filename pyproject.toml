[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "keystats"
version = "0.1.0"
description = "Passive keyboard usage & misfire statistics for tuning a QMK/Vial layout (Linux, evdev)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["evdev>=1.6"]

[project.scripts]
keystats = "keystats.cli:main"

[tool.setuptools]
packages = ["keystats"]
